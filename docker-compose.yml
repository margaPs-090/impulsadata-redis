services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    container_name: impulsa_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: impulsadata
      MYSQL_USER: impulsa
      MYSQL_PASSWORD: impulsa123
    ports:
      - "3307:3306"        # 3307 para no chocar con MySQL local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    container_name: mi_redis
    ports:
      - "6379:6379"
      - "8001:8001"        # RedisInsight (interfaz web)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impulsa_app
    profiles: ["app"]      # no se arranca con "up"; usar "run"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: impulsa
      MYSQL_PASSWORD: impulsa123
      MYSQL_DATABASE: impulsadata

volumes:
  mysql_data:
